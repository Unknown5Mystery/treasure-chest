<style>
:root {
    color-scheme: dark;

    --bg: #101110;
    --surface: #171817;
    --surface-soft: #1c1d1b;
    --surface-hover: #212320;

    --border: #292b28;

    --text: #eeeeea;
    --muted: #92948e;
    --soft: #686b65;

    --dark: #e9e9e4;
    --dark-text: #161715;

    --radius: 14px;

    --shadow: 0 10px 35px rgba(0,0,0,.20);

    --brand-yellow: #fef200;
    --brand-yellow-rgb: 254, 242, 0;
    --white: #ffffff;
    --brand-font: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;

    /* Ocean blue, matched in brightness/saturation to the green
       placeholder it replaced so it reads just as easy on the eyes
       against the dark background. */
    --wave-color-1: #0d3348;
    --wave-color-2: #145f80;
    --wave-color-3: #2098c4;
}

* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    -webkit-font-smoothing: antialiased;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.landing {
    position: relative;
    z-index: 1;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;

    padding: 40px 24px;
    text-align: center;
}

.brand-mark {
    width: 84px;
    height: 84px;

    display: block;
}

.brand-wordmark {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    color: var(--brand-yellow);

    font-family: var(--brand-font);
    font-size: 30px;
    font-weight: 800;
    line-height: 1.1;

    letter-spacing: .06em;
    text-transform: uppercase;
}

.tagline {
    max-width: 380px;

    font-size: 13px;
    line-height: 1.6;

    /* Reserves space for one line so the typewriter effect below
       (typed in, held, backspaced out) never shifts layout as the
       text grows and shrinks. */
    min-height: 1.6em;

    color: var(--brand-yellow);
}

.quote-cursor {
    display: inline-block;

    width: 2px;
    height: 1em;

    margin-left: 2px;
    vertical-align: -0.15em;

    background: var(--brand-yellow);
}

/* Blinks continuously — while typing, while backspacing, and during
   the hold in between. The class is added once by the JS below. */
.quote-cursor.blinking {
    animation: cursorBlink 1s linear infinite;
}

@keyframes cursorBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
    .quote-cursor.blinking {
        animation: none;
        opacity: 1;
    }
}

.open-chest-btn {
    height: 46px;

    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 0 22px;

    border: 1px solid var(--white);
    border-radius: 11px;

    background: var(--white);
    color: var(--dark-text);

    font-size: 12px;
    font-weight: 800;

    text-decoration: none;
    white-space: nowrap;

    transition: background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
}

.open-chest-btn:hover {
    background: var(--brand-yellow);
    border-color: var(--brand-yellow);
    color: var(--dark-text);
    transform: translateY(-1px);
}

.open-chest-btn svg {
    width: 15px;
    height: 15px;
}


/* ============================================================
   WATER WAVES
   A looping band pinned to the bottom of the screen, under the
   button. Each layer is one SVG wave shape drawn twice side by
   side (2400 wide inside a viewBox = two 1200-wide tiles), sitting
   in an element twice the container's width; animating it exactly
   -50% shifts it by one whole tile, so it loops with no visible
   seam. Three layers at different speeds/opacity/heights give it
   a bit of depth instead of one flat sheet moving in lockstep.
============================================================ */

.waves {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    height: 200px;

    overflow: hidden;

    pointer-events: none;
    z-index: 0;
}

/* A plain, unanimated strip in the front wave's own color, sitting
   behind all three layers at the very bottom edge. Every layer's
   bob (below) occasionally lifts it a few pixels off the container's
   true bottom, which would otherwise flash a gap of raw page
   background through the seam; this "floor" is tall enough to cover
   the largest possible bob (see randomizeWaves' amplitude range) so
   that gap always reads as more water instead of the black page
   behind it. It stays fully hidden at rest, since the front layer's
   own fill already reaches well past this depth on its own. */
.waves-floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 20px;

    background: var(--wave-color-3);
}

/* Wraps each wave-layer so the horizontal scroll (below) and this
   slow, gentle vertical bob can run as two independent transform
   animations — one per element — instead of fighting over the same
   "transform" property on a single element. The randomizeWaves()
   script sets --bob-duration/--bob-delay/--bob-amount per layer, so
   the three don't drift up and down in lockstep either. */
.wave-wrap {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    animation-name: waveBob;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-duration: var(--bob-duration, 6s);
    animation-delay: var(--bob-delay, 0s);
}

@keyframes waveBob {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(var(--bob-amount, -6px));
    }
}

.wave-layer {
    position: absolute;
    left: 0;
    bottom: 0;

    width: 200%;
    height: 100%;

    display: block;

    animation-name: waveScroll;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

/* Each layer's box height also controls how high its crest can reach —
   a shorter box physically can't paint above its own top edge, no
   matter what's drawn inside it. So the FARTHEST layer gets the
   TALLEST box (it should read as reaching up high in the distance)
   and the NEAREST layer gets the SHORTEST box (it sits low and solid
   in front) — that's what keeps all three visible at once instead of
   the nearest one painting over the other two. */
.wave-back {
    height: 100%;
    opacity: .5;
    animation-duration: 16s;
}

.wave-mid {
    height: 72%;
    opacity: .75;
    animation-duration: 11s;
    animation-direction: reverse;
}

.wave-front {
    height: 48%;
    opacity: 1;
    animation-duration: 8s;
}

.wave-back path { fill: var(--wave-color-1); }
.wave-mid path { fill: var(--wave-color-2); }
.wave-front path { fill: var(--wave-color-3); }

@keyframes waveScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}

@media (prefers-reduced-motion: reduce) {
    .wave-layer, .wave-wrap {
        animation: none;
    }
}


</style>
</head>

<script>
    const quotes = [
        "Just keep swimming.",
        "The sea lives in every one of us.",
        "At sea, I learned how little a person needs, not how much.",
        "Swim on.",
        "Go with the flow.",
        "Stay afloat.",
        "Keep your fins up.",
        "Find your current.",
        "Follow the tide.",
        "Make waves.",
        "Keep moving with the current.",
        "Dive in.",
        "Never stop swimming."
    ];

    const quoteTextEl = document.getElementById("quote-text");
    const cursorEl = document.querySelector(".quote-cursor");

    let quoteIndex = Math.floor(Math.random() * quotes.length);

    const prefersReducedMotion =
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (prefersReducedMotion) {

        // No typing/backspacing animation — just show a line, in the
        // same solid yellow, with a steady (non-blinking) cursor.
        quoteTextEl.textContent = quotes[quoteIndex];

    } else {

        const TYPE_MS = 120;    // per character, typing in (100 WPM)
        const DELETE_MS = 68;   // per character, backspacing out (a bit snappier, still human)
        const HOLD_MS = 3000;   // how long the finished line sits before erasing

        // Blinks continuously the whole time — typing, backspacing, and
        // the hold in between.
        cursorEl.classList.add("blinking");

        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function typeOut(text) {
            for (let i = 1; i <= text.length; i++) {
                quoteTextEl.textContent = text.slice(0, i);
                await wait(TYPE_MS);
            }
        }

        async function backspaceOut(text) {
            for (let i = text.length; i >= 0; i--) {
                quoteTextEl.textContent = text.slice(0, i);
                await wait(DELETE_MS);
            }
        }

        function pickNextIndex() {
            if (quotes.length <= 1) {
                return quoteIndex;
            }
            let idx = Math.floor(Math.random() * quotes.length);
            while (idx === quoteIndex) {
                idx = Math.floor(Math.random() * quotes.length);
            }
            return idx;
        }

        // Type a quote in, hold it for a beat, backspace it out, pick a
        // new (different) one, and repeat — forever. Always the same
        // solid yellow, no fading.
        (async function typewriterLoop() {
            for (;;) {
                const text = quotes[quoteIndex];
                await typeOut(text);
                await wait(HOLD_MS);
                await backspaceOut(text);
                quoteIndex = pickNextIndex();
            }
        })();

    }
</script>

    <script>
        // Gives each wave layer its own randomized speed, starting
        // phase, and a slight independent vertical bob, so the loop
        // doesn't look identical on every page load or fall into an
        // obviously mechanical, perfectly-synced rhythm across the
        // three layers.
        (function randomizeWaves() {

            const baseScrollDuration = {
                "wave-back": 16,
                "wave-mid": 11,
                "wave-front": 8
            };

            document.querySelectorAll(".wave-layer").forEach(svg => {

                const key =
                    svg.classList.contains("wave-back") ? "wave-back" :
                    svg.classList.contains("wave-mid") ? "wave-mid" :
                    "wave-front";

                const base = baseScrollDuration[key];

                // ±18% off the base speed, and a random starting point
                // within that loop (a negative delay drops the
                // animation in already-in-progress at a random spot).
                const duration = base * (0.82 + Math.random() * 0.36);
                const startOffset = Math.random() * duration;

                svg.style.animationDuration = duration.toFixed(2) + "s";
                svg.style.animationDelay = "-" + startOffset.toFixed(2) + "s";

            });

            document.querySelectorAll(".wave-wrap").forEach(wrap => {

                const bobDuration = 5 + Math.random() * 5;
                const bobDelay = Math.random() * bobDuration;
                // Always rise from rest, never dip down: a layer's resting
                // position is already its shortest state (that's what keeps
                // the layer behind it visible above it by design), so any
                // downward bob would shrink it further and expose a gap
                // where the layer behind shows through underneath. Bobbing
                // only upward means it can cover more of what's behind but
                // never less.
                const bobAmount = -(4 + Math.random() * 7);

                wrap.style.setProperty("--bob-duration", bobDuration.toFixed(2) + "s");
                wrap.style.setProperty("--bob-delay", "-" + bobDelay.toFixed(2) + "s");
                wrap.style.setProperty("--bob-amount", bobAmount.toFixed(1) + "px");

            });

        })();
    </script>
