<style>
:root {
    color-scheme: dark;

    --bg: #101110;
    --surface: #171817;
    --surface-soft: #1c1d1b;
    --surface-hover: #212320;

    --border: #292b28;

    --text: #eeeeea;
    --muted: #92948e;
    --soft: #686b65;

    --dark: #e9e9e4;
    --dark-text: #161715;

    --radius: 14px;

    --shadow: 0 10px 35px rgba(0,0,0,.20);

    --brand-yellow: #fef200;
    --brand-font: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
}

* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    -webkit-font-smoothing: antialiased;

    display: flex;
    align-items: center;
    justify-content: center;
}

.landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;

    padding: 40px 24px;
    text-align: center;
}

.brand-mark {
    width: 84px;
    height: 84px;

    display: block;
}

.brand-wordmark {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    color: var(--brand-yellow);

    font-family: var(--brand-font);
    font-size: 30px;
    font-weight: 800;
    line-height: 1.1;

    letter-spacing: .06em;
    text-transform: uppercase;
}

.tagline {
    max-width: 380px;

    margin-top: -6px;

    color: var(--muted);

    font-size: 13px;
    line-height: 1.6;
}

.open-chest-btn {
    height: 46px;

    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 0 22px;

    border: 1px solid var(--dark);
    border-radius: 11px;

    background: var(--dark);
    color: var(--dark-text);

    font-size: 12px;
    font-weight: 800;

    text-decoration: none;
    white-space: nowrap;

    transition: background .15s ease, transform .15s ease;
}

.open-chest-btn:hover {
    background: #ffffff;
    transform: translateY(-1px);
}

.open-chest-btn svg {
    width: 15px;
    height: 15px;
}
</style>
</head>
